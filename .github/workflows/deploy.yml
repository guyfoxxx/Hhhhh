name: Build Static Rahgosha

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Check output
        run: |
          ls -la
          ls -la out || true
          ls -la .next || true

      - name: Create ZIP
        run: |
          if [ -d "out" ]; then
            cd out
            zip -r ../rahgosha-static.zip .
          else
            echo "out folder not found"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rahgosha-static
          path: rahgosha-static.zip
